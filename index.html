<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Clics - DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Interactividad con el DOM</h1>
        <p>Haz clic en el botón para incrementar el contador y registrar la hora exacta del evento en la tabla.</p>
        
        <div id="contador" class="counter-box">0</div>
        <button id="btn-like">¡Haz Clic Aquí!</button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>N° Clic</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                    
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

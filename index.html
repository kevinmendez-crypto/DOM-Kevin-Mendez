<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación de Clics - Web</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #ffffff; padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        h1 { font-size: 20px; color: #333; margin-bottom: 8px; }
        p { font-size: 13px; color: #666; margin-bottom: 15px; }
        #contador { font-size: 48px; color: #2196F3; font-weight: bold; margin-bottom: 15px; }
        .alerta { color: #E91E63; }
        .btn-sumar { background-color: #4CAF50; color: white; padding: 10px; border: none; border-radius: 8px; width: 100%; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-restar { background-color: #FF5722; color: white; padding: 10px; border: none; border-radius: 8px; width: 100%; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .table-container { width: 100%; max-height: 160px; border: 1px solid #ddd; border-radius: 6px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { font-size: 12px; color: #333; text-align: center; padding: 6px; border-bottom: 1px solid #eee; }
        th { font-weight: bold; background-color: #f8f9fa; }
        tr:nth-child(even) { background-color: #fafafa; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Interactividad con el DOM</h1>
        <p>Haz clic para sumar o restar clics. Al pasar de 10, el contador cambia de color.</p>
        
        <div id="contador">0</div>

        <button class="btn-sumar" onclick="sumar()">¡Sumar Clic (+)</button>
        <button class="btn-restar" onclick="restar()">Restar Clic (-)</button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>N° Clic</th>
                        <th>Hora / Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let contador = 0;

        function sumar() {
            contador++;
            actualizarInterfaz("sumar");
        }

        function restar() {
            if (contador > 0) {
                contador--;
                actualizarInterfaz("restar");
            }
        }

        function actualizarInterfaz(tipo) {
            const cajaContador = document.getElementById("contador");
            cajaContador.textContent = contador;

     
            if (contador > 10) {
                cajaContador.classList.add("alerta");
            } else {
                cajaContador.classList.remove("alerta");
            }

  
            const horaActual = new Date().toLocaleTimeString();
            const tbody = document.getElementById("tabla-cuerpo");
            const fila = document.createElement("tr");
            
            const textoAccion = tipo === "restar" ? `${horaActual} (Restado)` : horaActual;

            fila.innerHTML = `<td>${contador}</td><td>${textoAccion}</td>`;
            tbody.insertBefore(fila, tbody.firstChild);
        }
    </script>
</body>
</html>
